# Five Pop!_OS insights: COSMIC/desktop, apt/Proton libs, RAPL udev, Mesa GPU thermals.
# Pack is gated by match_when: platform.is_pop (see pack.yaml).
# How to write packs: docs/RULES.md  |  commented example: rules/examples/hello-swappiness/
rules:
  - id: display-hdr-off
    detect:
      all:
        - metric: display.hdr_capable
          eq: true
        - metric: display.hdr_active
          eq: false
    emit:
      insight_id: display-hdr-off
      level: info
      title: HDR capable — currently off
      text: >-
        {display.hdr_connector} reports HDR10 (~{display.hdr_max_nits:.0f} nits) but the
        desktop is in SDR (colorspace {display.hdr_colorspace}). COSMIC does not yet expose
        a desktop HDR toggle; enable HDR in the monitor OSD and/or use gamescope for
        per-game HDR when the title supports it.
      bucket: tools
      condition_live: true
    actions:
      - label: Monitor OSD
        kind: note
        note: Enable HDR / HDR10 in the monitor's on-screen menu if present
      - label: Install gamescope (per-game HDR)
        kind: cmd
        cmd: sudo apt install gamescope
      - label: Steam launch option (games with HDR support)
        kind: steam
        cmd: gamescope --hdr-enabled --adaptive-sync -- %command%
        note: Nested compositor; try only if the game supports HDR

  - id: cpu-rapl-unreadable
    detect:
      all:
        - metric: tools.cpu_rapl_present
          eq: true
        - metric: tools.cpu_rapl
          eq: false
    emit:
      insight_id: cpu-rapl-unreadable
      level: info
      title: "CPU watts need a RAPL udev rule"
      text: >-
        RAPL package power is present (intel-rapl / powercap) but energy_uj is
        root-only, so the Live lab CPU watt dial stays n/a. One-time udev rule —
        not an apt package. k10temp only has temperatures; zenpower is not in
        Pop!_OS repos.
      bucket: tools
      condition_live: true
      games: [all]
    actions:
      - label: Install RAPL udev rule
        kind: cmd
        cmd: sudo cp deploy/99-rapl-readable.rules /etc/udev/rules.d/ && sudo udevadm control --reload && sudo udevadm trigger -s powercap
        note: Run from the Pulse install directory, then restart Pulse

  - id: game-libs-missing
    detect:
      metric: diag.game_libs_missing
      eq: true
    emit:
      insight_id: game-libs-missing
      level_when:
        detect:
          metric: diag.lib_missing_hot
          eq: true
        then: hot
        else: warn
      title: Missing gaming libraries
      text: >-
        {diag.lib_missing_summary} — common cause of Proton games failing to launch or rendering black screens.
      bucket: steam
      condition_live: true
      requires_root: true
    actions:
      - label: Enable 32-bit multilib
        kind: cmd
        cmd: sudo dpkg --add-architecture i386 && sudo apt update
        note: One-time step on Pop!_OS when 32-bit Proton libs are missing
      - label: Install missing packages
        kind: cmd
        cmd: "{diag.lib_apt_install}"
        note: Built from live diagnostics scan; needs sudo

  - id: mangohud-recommended
    detect:
      metric: tools.mangohud
      eq: false
    emit:
      insight_id: mangohud-recommended
      level: info
      title: "Recommended: MangoHud for real FPS / frametime"
      text: >-
        Optional overlay for true in-game FPS and frametime. Logging to
        ~/mangohud-logs lets Pulse attach FPS avg / 1% lows after you quit.
        Kernel stutter stays as proxy when no log is present. The silent conf
        keeps logging without the default giant HUD (do not use no_display —
        several MangoHud builds then skip the log). Shift+F2 toggles logging.
        Not required — skip if you prefer no HUD at all.
      bucket: tools
      condition_live: true
      games: [all]
    actions:
      - label: Install MangoHud
        kind: cmd
        cmd: sudo apt install mangohud
        note: One-time; Pop!_OS package
      - label: Write logging conf (small HUD)
        kind: cmd
        cmd: >-
          mkdir -p "$HOME/.config/MangoHud" "$HOME/mangohud-logs" && printf '%s\n'
          '# Pulse — small HUD + FPS log' 'legacy_layout=false' 'fps' 'frame_timing'
          'cpu_stats=0' 'gpu_stats=0' 'position=top-left'
          "output_folder=$HOME/mangohud-logs" 'autostart_log=1' 'log_interval=100'
          'permit_upload=0' 'toggle_logging=Shift_L+F2'
          | tee "$HOME/.config/MangoHud/MangoHud.conf"
        note: Overwrites ~/.config/MangoHud/MangoHud.conf. tee prints the file so you can confirm.
      - label: Steam launch option
        kind: steam
        cmd: mangohud %command%
        note: Steam → game → Properties → Launch Options (per game). Uses the conf from the step above.
      - label: Silent overlay (log only)
        kind: cmd
        cmd: >-
          mkdir -p "$HOME/.config/MangoHud" "$HOME/mangohud-logs" && printf '%s\n'
          '# Pulse — log only, overlay fully transparent'
          '# no_display skips logging in several MangoHud builds — use alpha=0 instead'
          'legacy_layout=false' 'fps' 'frame_timing=0' 'cpu_stats=0' 'gpu_stats=0'
          'alpha=0.0' 'background_alpha=0.0' "output_folder=$HOME/mangohud-logs"
          'autostart_log=1' 'log_interval=100' 'permit_upload=0'
          'toggle_hud=Shift_R+F12' 'toggle_logging=Shift_L+F2'
          | tee "$HOME/.config/MangoHud/MangoHud.conf"
        note: Same Steam launch option. Overlay is invisible; Shift+F12 shows it if you need it.

  - id: gpu-thermal-ceiling-hot
    detect:
      metric: thermal.is_hot
      eq: true
    emit:
      insight_id: gpu-thermal-ceiling
      level: hot
      title: Alert — GPU junction critical
      text: >-
        Junction is {gpu.junction_c}°C (alert ≥ {thermal.hot_c:.0f}°C for {thermal.arch_label}).
        Lower graphics settings or improve cooling before sustained throttle.
      condition_live: true
    actions:
      - label: "In-game: lower shadow / LOD / draw distance"
        kind: game
        cmd: Lower Level of Detail, Shadow quality, and cap FPS 60–90
      - label: Cap FPS in-game
        kind: game
        cmd: Graphics → Frame rate limit → 60–90
      - label: Fan curve (CoreCtrl / CoolerControl)
        kind: note
        cmd: Open CoreCtrl (AMD) or CoolerControl and steepen the GPU fan curve under load
        note: Optional GUI tools — install from Pop!_Shop if missing
