# GPU performance and thermals
rules:
  # Guidance-only threshold alert (no OS toast/audio). Fires for any GPU once
  # junction hits the profile hot band — including RDNA3 where fan_curve_helpful is false.
  - id: gpu-thermal-ceiling-hot
    detect:
      metric: thermal.is_hot
      eq: true
    emit:
      insight_id: gpu-thermal-ceiling
      level: hot
      title: Alert — GPU junction critical
      text: >-
        Junction is {gpu.junction_c}°C (alert ≥ {thermal.hot_c:.0f}°C for {thermal.arch_label}).
        Lower graphics settings or improve cooling before sustained throttle.
      condition_live: true
    actions:
      - label: "In-game: lower shadow / LOD / draw distance"
        kind: game
        cmd: Lower Level of Detail, Shadow quality, and cap FPS 60–90
      - label: Cap FPS in-game
        kind: game
        cmd: Graphics → Frame rate limit → 60–90
      - label: Fan curve (CoreCtrl / CoolerControl)
        kind: note
        cmd: Open CoreCtrl (AMD) or CoolerControl and steepen the GPU fan curve under load
        note: Optional GUI tools — install from Pop!_Shop if missing

  - id: gpu-thermal-ceiling-throttle
    detect:
      all:
        - metric: thermal.throttling
          eq: true
        - metric: thermal.is_hot
          eq: false
    emit:
      insight_id: gpu-thermal-ceiling
      level: warn
      title: GPU throttling
      text: >-
        Junction {gpu.junction_c}°C and clocks dropped to {thermal.gfx_mhz} MHz
        (session peak ~{thermal.peak_mhz} MHz). {thermal.arch_label} is throttling — lower graphics settings.
      condition_live: true
    actions:
      - label: "In-game: lower shadow / LOD / draw distance"
        kind: game
        cmd: Lower Level of Detail, Shadow quality, and cap FPS 60–90
      - label: Fan curve (CoreCtrl / CoolerControl)
        kind: note
        cmd: Open CoreCtrl (AMD) or CoolerControl and steepen the GPU fan curve under load
        note: Optional GUI tools — install from Pop!_Shop if missing

  - id: gpu-thermal-warm
    detect:
      all:
        - metric: thermal.fan_curve_helpful
          eq: true
        - metric: thermal.is_warm
          eq: true
        - metric: thermal.is_hot
          eq: false
    emit:
      insight_id: gpu-thermal-warm
      level: warn
      title: GPU getting warm
      text: >-
        Junction is {gpu.junction_c}°C. {thermal.design_note}
    actions:
      - label: Cap FPS in-game
        kind: game
        cmd: Graphics → Frame rate limit → 90
      - label: Check GPU power
        kind: cmd
        cmd: sensors | grep -iE 'junction|ppt'
      - label: Fan curve (CoreCtrl / CoolerControl)
        kind: note
        cmd: Open CoreCtrl (AMD) or CoolerControl and steepen the GPU fan curve under load
        note: Optional GUI tools — install from Pop!_Shop if missing

  # Soft info only while warm — never competes with the critical alert above.
  - id: gpu-thermal-by-design
    detect:
      all:
        - metric: thermal.by_design
          eq: true
        - metric: thermal.is_hot
          eq: false
    emit:
      insight_id: gpu-thermal-by-design
      level: info
      title: GPU running hot by design
      text: >-
        Junction {gpu.junction_c}°C — {thermal.design_note}
        Clocks at {thermal.gfx_mhz} MHz (peak ~{thermal.peak_mhz} MHz this session).
    actions:
      - label: Check clocks + temps
        kind: cmd
        cmd: sensors | grep -E 'junction|edge|fan|PPT'
        note: Stable clocks under load = normal for this architecture

  - id: gpu-vram-bandwidth
    detect:
      all:
        - metric: gpu.mem_busy_pct
          gte: 65
    emit:
      insight_id: gpu-vram-bandwidth
      level: info
      title: VRAM bus is busy
      text: >-
        Memory controller at {gpu.mem_busy_pct:.0f}% (~{gpu.vram_used_mb} MB VRAM in use).
        Textures are pushing the GDDR hard.
    actions:
      - label: "In-game: reduce texture / asset quality"
        kind: game
        cmd: "{game.name} → graphics → lower texture and asset quality"

  - id: gpu-vram-full
    detect:
      metric: gpu.vram_pct
      gte: 80
    emit:
      insight_id: gpu-vram-full
      level: warn
      title: Running low on VRAM
      text: >-
        {gpu.vram_pct:.0f}% VRAM used ({gpu.vram_used_mb} MB). Spilling into system RAM causes stutters.
    actions:
      - label: "In-game: lower resolution scale"
        kind: game
        cmd: "{game.name} → graphics → resolution scale 85–90%"
      - label: "In-game: reduce texture quality"
        kind: game
        cmd: "{game.name} → graphics → medium textures"

  - id: gpu-gtt-churn
    detect:
      all:
        - metric: gpu.gtt_sustained_high
          eq: true
        - metric: gpu.gtt_rate_mbps
          gt: 50
        - metric: signals.gtt_spill_risk
          eq: true
    emit:
      insight_id: gpu-gtt-churn
      level: info
      title: GPU using system RAM
      text: >-
        Shared memory pool churn at {gpu.gtt_rate_mbps:.0f} MB/s while VRAM is {gpu.vram_pct:.0f}% full
        (GTT pool {gpu.gtt_pool_pct:.0f}% used). Lower textures or resolution if you see hitches.
    actions:
      - label: "In-game: drop texture / asset mods"
        kind: game
        cmd: "{game.name} → disable high-res asset or texture mods"