# Audio pipeline basics — PipeWire/Pulse routing, rate, quantum, underruns.
# Probe is cached (~20s) via audio_probe; metrics under audio.*.
rules:
  - id: audio-default-sink-missing
    detect:
      any:
        - metric: audio.default_missing
          eq: true
        - metric: audio.default_unavailable
          eq: true
    emit:
      insight_id: audio-default-sink-missing
      level: warn
      title: "No usable default audio output"
      text: >-
        PipeWire/Pulse has no healthy default sink (missing or unavailable).
        Games and Discord will be silent or open a random device. Open sound
        settings or use the Guidance steps to list sinks and set a default.
      bucket: audio
      condition_live: true
      games: all
    actions:
      - label: List sinks
        kind: cmd
        cmd: wpctl status
        note: "Also try: pactl list short sinks"
      - label: Sound settings
        kind: cmd
        cmd: pavucontrol || gnome-control-center sound || systemsettings kcm_pulseaudio
        note: "Pick a wired/DAC output for gaming"

  - id: audio-hdmi-default-alt
    detect:
      metric: audio.hdmi_over_alt
      eq: true
    emit:
      insight_id: audio-hdmi-default-alt
      level: warn
      title: "Default audio is HDMI — another output is available"
      text: >-
        Default sink is monitor/HDMI ({audio.default_sink_desc}) while
        {audio.alt_sink_desc} is also available. Games often follow the system
        default — if you hear crackles, wrong device, or “stuttery” audio,
        switch default output to your DAC/headphones (KDE Sound / pavucontrol).
      bucket: audio
      condition_live: true
      games: all
    actions:
      - label: Show devices
        kind: cmd
        cmd: wpctl status
      - label: Open volume control
        kind: cmd
        cmd: pavucontrol || systemsettings kcm_pulseaudio || gnome-control-center sound

  - id: audio-bluetooth-default
    detect:
      metric: audio.default_bluetooth
      eq: true
    emit:
      insight_id: audio-bluetooth-default
      level: warn
      title: "Bluetooth is the default audio output"
      text: >-
        Default sink is Bluetooth ({audio.default_sink_desc}). BT adds latency
        and is a common source of gaming crackles/pops under load. Prefer a
        wired headset or DAC for competitive play; leave BT for voice chat only
        if needed.
      bucket: audio
      condition_live: true
      games: all
    actions:
      - label: Show devices
        kind: cmd
        cmd: wpctl status
      - label: Open volume control
        kind: cmd
        cmd: pavucontrol || systemsettings kcm_pulseaudio || gnome-control-center sound

  - id: audio-odd-sample-rate
    detect:
      metric: audio.rate_odd
      eq: true
    emit:
      insight_id: audio-odd-sample-rate
      level: warn
      title: "Unusual audio sample rate ({audio.default_rate} Hz)"
      text: >-
        Graph rate is {audio.default_rate} Hz (typical gaming path is 48000 or
        44100). Forced high rates (96k) or odd rates (32k) make some games and
        Proton paths resample harder and can sound like stutter or crackle.
        Prefer 48000 unless you know you need something else.
      bucket: audio
      condition_live: true
      games: all
    actions:
      - label: Show clock settings
        kind: cmd
        cmd: pw-metadata -n settings
        note: Look for clock.rate / clock.allowed-rates

  - id: audio-large-quantum
    detect:
      metric: audio.large_quantum
      eq: true
    emit:
      insight_id: audio-large-quantum
      level: info
      title: "Audio buffer ~{audio.latency_ms:.0f} ms (quantum {audio.quantum})"
      text: >-
        PipeWire quantum {audio.quantum} at {audio.default_rate} Hz ≈
        {audio.latency_ms:.0f} ms of buffering. Higher buffers add latency;
        very low buffers can crackle under GPU/CPU load (xruns). For gaming,
        256–512 is a common sweet spot — change only if you feel delay or
        crackles. Pulse will not rewrite your PipeWire conf automatically.
      bucket: audio
      condition_live: true
      games: all
    actions:
      - label: Show quantum
        kind: cmd
        cmd: pw-metadata -n settings
      - label: Try 512 (session only)
        kind: cmd
        cmd: pw-metadata -n settings 0 clock.force-quantum 512
        note: Temporary until logout; 0 clears force

  - id: audio-xruns-recent
    detect:
      metric: audio.xruns_recent
      eq: true
    emit:
      insight_id: audio-xruns-recent
      level: warn
      title: "Recent audio underruns (xruns) in the journal"
      text: >-
        PipeWire/WirePlumber logged underrun/xrun warnings in the last ~2 hours
        ({audio.xrun_mentions} hits). That often feels like audio hitching or
        crackles during games — especially with a tight quantum under load.
        Check rate (prefer 48000), raise quantum slightly, and avoid Bluetooth
        for game audio. Sample: {audio.xrun_sample}
      bucket: audio
      condition_live: true
      games: all
    actions:
      - label: Show settings
        kind: cmd
        cmd: pw-metadata -n settings
      - label: Raise buffer (session)
        kind: cmd
        cmd: pw-metadata -n settings 0 clock.force-quantum 1024
        note: Temporary; reduces crackles, adds a little latency

  # --- Pop!_OS / stock PipeWire known-bad patterns ---

  - id: audio-stock-min-quantum
    detect:
      metric: audio.stock_min_quantum
      eq: true
    emit:
      insight_id: audio-stock-min-quantum
      level: warn
      title: "Stock PipeWire min buffer ({audio.min_quantum}) — gaming crackle risk"
      text: >-
        Live clock.min-quantum is {audio.min_quantum} (Pop/Ubuntu stock is 32).
        That lets games and Steam request very small buffers; under GPU/CPU load
        PipeWire often underruns and you hear crackles/pops that feel like hitching.
        Raise the floor to 256 or 512 in a single context.properties drop-in, then
        restart PipeWire (see Guidance steps). Session-only: force-quantum 512–1024.
      bucket: audio
      condition_live: true
      games: all
    actions:
      - label: Show live clock
        kind: cmd
        cmd: pw-metadata -n settings
      - label: Floor at 512 (session)
        kind: cmd
        cmd: pw-metadata -n settings 0 clock.force-quantum 512
        note: Temporary until logout; not a permanent conf fix

  - id: audio-conf-not-applied
    detect:
      metric: audio.conf_not_applied
      eq: true
    emit:
      insight_id: audio-conf-not-applied
      level: warn
      title: "PipeWire conf not applied (want min {audio.conf_min_quantum}, live {audio.min_quantum})"
      text: >-
        Drop-ins under ~/.config/pipewire ask for min-quantum {audio.conf_min_quantum},
        but the running graph still has min-quantum {audio.min_quantum}. Common causes:
        (1) two context.properties blocks in one file — the second overwrites the first;
        (2) PipeWire not restarted after edits; (3) syntax ignored. Merge clock settings
        into one context.properties block, then:
        systemctl --user restart pipewire pipewire-pulse wireplumber
      bucket: audio
      condition_live: true
      games: all
    actions:
      - label: Open user conf dir
        kind: cmd
        cmd: xdg-open "$HOME/.config/pipewire" 2>/dev/null || ls -la "$HOME/.config/pipewire"
      - label: Restart PipeWire
        kind: cmd
        cmd: systemctl --user restart pipewire pipewire-pulse wireplumber
        note: Brief audio drop; apps may need reconnect

  - id: audio-conf-multi-context
    detect:
      all:
        - metric: audio.conf_multi_context_properties
          eq: true
        - metric: audio.user_conf_present
          eq: true
    emit:
      insight_id: audio-conf-multi-context
      level: info
      title: "User PipeWire conf has multiple context.properties blocks"
      text: >-
        A drop-in under ~/.config/pipewire defines context.properties more than once.
        PipeWire may keep only the last block — clock.rate / quantum settings in the
        first block are silently dropped. Merge into a single context.properties = { }
        and restart PipeWire.
      bucket: audio
      condition_live: true
      games: all
    actions:
      - label: Open conf dir
        kind: cmd
        cmd: xdg-open "$HOME/.config/pipewire" 2>/dev/null || ls -laR "$HOME/.config/pipewire"

  - id: audio-hdmi-priority-conf
    detect:
      metric: audio.conf_hdmi_over_usb_priority
      eq: true
    emit:
      insight_id: audio-hdmi-priority-conf
      level: info
      title: "WirePlumber ranks HDMI above your USB DAC"
      text: >-
        A WirePlumber drop-in gives HDMI/monitor audio a higher session priority
        than your USB DAC/headset. That makes HDMI the default when both exist —
        fine for desktop media, easy to miss for games (sound on the monitor,
        “missing” game audio, or odd crackles on the wrong device). Prefer the DAC
        for gaming, or lower HDMI priority.session when you play.
      bucket: audio
      condition_live: true
      games: all
    actions:
      - label: Open WirePlumber conf
        kind: cmd
        cmd: xdg-open "$HOME/.config/wireplumber" 2>/dev/null || ls -laR "$HOME/.config/wireplumber"
