# Possible resolutions — pattern-based suggestions while a game runs
rules:
  - id: gpu-fps-cap
    detect:
      all:
        - metric: game.running
          eq: true
        - metric: gpu.busy_pct
          gte: 85
        - metric: display.refresh_hz
          exists: true
        - metric: display.refresh_hz
          lte: 75
    emit:
      insight_id: gpu-fps-cap
      level: info
      title: Cap FPS to your display refresh
      text: >-
        GPU is {gpu.busy_pct:.0f}% busy on a {display.cap_hz} Hz display while {game.name} runs.
        Frames above {display.cap_hz} FPS won't appear on screen but still burn GPU time.
      games: active
      bucket: resolutions
    actions:
      - label: "In-game: cap at {display.cap_hz} FPS"
        kind: game
        cmd: "{game.name} → Options → Graphics → Frame rate limit → {display.cap_hz}"
      - label: "Optional: cap slightly above refresh"
        kind: game
        cmd: Use {display.cap_hz} only if thermals stay cool; avoid uncapped rendering

  - id: resolution-swap-stutter
    detect:
      all:
        - metric: game.running
          eq: true
        - metric: memory.swap_pct
          gte: 10
        - metric: memory.swap_pct
          lt: 25
        - metric: stutter.score
          gte: 20
        - metric: stutter.score
          lt: 42
    emit:
      insight_id: resolution-swap-stutter
      level: info
      title: Free RAM — swap and hitches are rising
      text: >-
        Swap is {memory.swap_pct:.0f}% and stutter proxy is {stutter.score:.0f}/100 while {game.name} runs.
        Close browser tabs and other heavy apps before lowering graphics settings.
      games: active
      bucket: resolutions
    actions:
      - label: See what is using RAM
        kind: cmd
        cmd: ps aux --sort=-%mem | head -15
      - label: Close Brave — copy & run
        kind: cmd
        cmd: flatpak kill com.brave.Browser
        note: You run this; Pulse never does
      - label: Lower swappiness — copy & run
        kind: cmd
        cmd: sudo sysctl vm.swappiness=10
        note: Needs sudo; Pulse never does

  - id: resolution-load-settle
    detect:
      metric: signals.page_fault_settle
      eq: true
    emit:
      insight_id: resolution-load-settle
      level: info
      title: Load phase — wait for assets to settle
      text: >-
        Load-phase settle: {memory.pgmajfault_per_s}/s major page faults — assets still streaming
        into RAM. Wait ~30s after the loading bar before heavy camera moves (avoids false stutter warnings).
      games: active
      bucket: resolutions
    actions:
      - label: Wait after load
        kind: game
        cmd: Stay paused 30s after the loading bar finishes
      - label: Avoid alt-tab during catch-up
        kind: game
        cmd: Let RAM fill before heavy camera moves

  - id: resolution-cpu-perf
    detect:
      all:
        - metric: game.running
          eq: true
        - metric: ctx.governor
          eq: powersave
        - metric: gpu.busy_pct
          lt: 70
        - metric: cpu.overall_pct
          gt: 75
    emit:
      insight_id: resolution-cpu-perf
      level: info
      title: CPU-bound — turn on performance governor
      text: >-
        GPU has headroom but CPU is {cpu.overall_pct:.0f}% busy while governor is '{ctx.governor}'.
        Simulation-heavy scenes in {game.name} benefit from performance mode.
      requires_root: true
      games: active
      bucket: resolutions
    actions:
      - label: Set performance governor (until reboot)
        kind: cmd
        cmd: echo performance | sudo tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor