# Recommended optional gaming tools
rules:
  - id: mangohud-recommended
    # Live PATH check only — do not require diagnostics scan (TTL can lag install/removal).
    detect:
      metric: tools.mangohud
      eq: false
    emit:
      insight_id: mangohud-recommended
      level: info
      title: "Recommended: MangoHud for real FPS / frametime"
      text: >-
        Optional overlay for true in-game FPS and frametime. With logging on
        (sample conf → ~/mangohud-logs), Pulse attaches FPS avg / 1% lows to
        finished sessions. Kernel stutter stays as proxy when no log is present.
        Not required — skip if you prefer a clean HUD.
      bucket: tools
      condition_live: true
      games: all
    actions:
      - label: Install MangoHud
        kind: cmd
        cmd: sudo apt install mangohud
        note: One-time; Pop!_OS package
      - label: Steam launch option
        kind: steam
        cmd: mangohud %command%
        note: Steam → game → Properties → Launch Options (per game)
      - label: Or with GameMode
        kind: steam
        cmd: gamemoderun mangohud %command%
        note: Lower latency + overlay together

  - id: gamemode-recommended
    detect:
      metric: tools.gamemoded
      eq: false
    emit:
      insight_id: gamemode-recommended
      level: info
      title: "Recommended: GameMode for launch tuning"
      text: >-
        GameMode asks the system for lower latency while a game runs.
        Wrap Steam launches with gamemoderun for an easy boost — optional, not required.
      bucket: tools
      condition_live: true
      games: all
    actions:
      - label: Install GameMode
        kind: cmd
        cmd: sudo apt install gamemode
      - label: Steam launch option
        kind: steam
        cmd: gamemoderun %command%
        note: Steam → game → Properties → Launch Options