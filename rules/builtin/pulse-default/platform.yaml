# Platform tuning — governor, swappiness
rules:
  - id: cpu-governor-powersave
    detect:
      metric: ctx.governor
      eq: powersave
    emit:
      insight_id: cpu-governor-powersave
      level: warn
      title: CPU stuck in power-save mode
      text: >-
        Governor is '{ctx.governor}' — cores may not boost fast enough while gaming.
        Switch to performance for game sessions.
      fix_script: cpu-governor-powersave
    actions:
      - label: Set performance governor (until reboot)
        kind: cmd
        cmd: echo performance | sudo tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor
      - label: Check available governors
        kind: cmd
        cmd: cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_available_governors

  - id: vm-swappiness-high
    detect:
      all:
        - metric: ctx.swappiness
          exists: true
        - metric: ctx.swappiness
          gt: 60
    emit:
      insight_id: vm-swappiness-high
      level: warn
      title: Swappiness too high for gaming
      text: >-
        vm.swappiness={ctx.swappiness} — the kernel swaps aggressively when RAM fills up,
        which causes hitches in any game.
      fix_script: vm-swappiness-high
      fix_kwargs:
        current: ctx.swappiness
    actions:
      - label: Lower swappiness for this boot
        kind: cmd
        cmd: sudo sysctl vm.swappiness=10
      - label: Persist lower swappiness
        kind: cmd
        cmd: echo 'vm.swappiness=10' | sudo tee /etc/sysctl.d/99-gaming.conf && sudo sysctl --system
      - label: Check current value
        kind: cmd
        cmd: cat /proc/sys/vm/swappiness

  # HDR: detect EDID capability + DRM active state. COSMIC has no one-click desktop HDR yet.
  - id: display-hdr-off
    detect:
      all:
        - metric: display.hdr_capable
          eq: true
        - metric: display.hdr_active
          eq: false
    emit:
      insight_id: display-hdr-off
      level: info
      title: HDR capable — currently off
      text: >-
        {display.hdr_connector} reports HDR10 (~{display.hdr_max_nits:.0f} nits) but the
        desktop is in SDR (colorspace {display.hdr_colorspace}). COSMIC does not yet expose
        a desktop HDR toggle; enable HDR in the monitor OSD and/or use gamescope for
        per-game HDR when the title supports it.
      fix_script: display-hdr-off
      bucket: tools
      condition_live: true
    actions:
      - label: Check live HDR state
        kind: cmd
        cmd: python3 -c "from hardware_probe import primary_display_hdr; import json; print(json.dumps(primary_display_hdr(0), indent=2))"
        note: Run from the Pulse install directory (or PYTHONPATH)
      - label: Monitor OSD
        kind: note
        cmd: Enable HDR / HDR10 in the monitor's on-screen menu if present
      - label: Install gamescope (per-game HDR)
        kind: cmd
        cmd: sudo apt install gamescope
      - label: Steam launch option (games with HDR support)
        kind: steam
        cmd: gamescope --hdr-enabled --adaptive-sync -- %command%
        note: Nested compositor; try only if the game supports HDR
      - label: See what is using RAM
        kind: cmd
        cmd: ps aux --sort=-%mem | head -20