name: release

# Push an annotated tag v0.x.y after bump_version.py. Stays GitHub prerelease
# while the version is 0.x.y.
on:
  push:
    tags:
      - "v0.*"

jobs:
  prerelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches pyproject
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$TAG pyproject=$PY"
          test "$TAG" = "$PY"
          python3 -c "import re,sys; v='$PY'; sys.exit(0 if re.fullmatch(r'0\.(0|[1-9]\d*)\.(0|[1-9]\d*)', v) else 1)"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Version + harness
        run: |
          python tests/test_version.py
          python tests/harness.py
      - name: Build .deb
        run: ./deploy/build-deb.sh
      - name: GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          DEB="build/deb/cosmic-pulse_${VER}_all.deb"
          test -f "$DEB"
          python3 deploy/bump_version.py notes > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" "$DEB" \
            --title "Cosmic Pulse $VER" \
            --notes-file /tmp/release-notes.md \
            --prerelease
