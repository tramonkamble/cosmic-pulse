name: harness

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -r requirements.txt
      - name: Product harness
        run: python tests/harness.py
      - name: Unit smokes
        run: |
          python tests/test_stutter.py
          python tests/test_rule_packs.py
          python tests/test_store_clear.py
