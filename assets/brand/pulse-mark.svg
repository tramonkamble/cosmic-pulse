<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Cosmic Pulse">
  <!--
    Cosmic Pulse mark — planet field + orbit + live waveform.
    Design: quiet geometry, Pulse tokens (accent purple, metric cyan).
    Waveform = live metrics · Orbit = Cosmic coach identity.
  -->
  <defs>
    <linearGradient id="pm-field" x1="18" y1="50" x2="46" y2="14" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0e1118"/>
      <stop offset="1" stop-color="#1c2436"/>
    </linearGradient>
    <linearGradient id="pm-orbit" x1="8" y1="46" x2="56" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#63d0de"/>
      <stop offset=".5" stop-color="#e69bfd"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="pm-wave" x1="14" y1="32" x2="50" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#63d0de"/>
      <stop offset="1" stop-color="#92ce9b"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="22" fill="url(#pm-field)" stroke="#2a3142" stroke-width="1.1"/>

  <!-- Sparse stars — quiet, not cluttered -->
  <g fill="#cedbee" opacity=".5">
    <circle cx="22" cy="20" r=".75"/>
    <circle cx="42" cy="18" r=".55"/>
    <circle cx="46" cy="36" r=".65"/>
    <circle cx="20" cy="41" r=".5"/>
    <circle cx="38" cy="44" r=".55"/>
  </g>
  <g fill="#e69bfd" opacity=".4">
    <circle cx="28" cy="16" r=".45"/>
    <circle cx="44" cy="28" r=".45"/>
  </g>

  <!-- Orbit -->
  <ellipse cx="32" cy="32" rx="28" ry="11"
    transform="rotate(-28 32 32)"
    stroke="url(#pm-orbit)" stroke-width="2.35" stroke-linecap="round"/>

  <!-- Live pulse -->
  <path
    d="M14 34.5H20.5L23.2 28.5 27.5 42 32 18 36.5 38.5 40 30 43 34.5H50"
    stroke="url(#pm-wave)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
